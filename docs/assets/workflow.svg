<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="520" fill="#070B10"/>
  <text x="60" y="72" fill="#E8F0ED" font-family="Inter,Segoe UI,sans-serif" font-size="40" font-weight="900">Scanner Workflow</text>
  <text x="60" y="106" fill="#8EA09A" font-family="Inter,Segoe UI,sans-serif" font-size="18">A passive scan pipeline that turns public website signals into actionable launch-readiness findings.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#58C7F3"/></marker></defs>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(70 180)"><rect width="150" height="92" rx="14" fill="#0F1720" stroke="#243443"/><text x="22" y="38" fill="#6FF1D1" font-size="16" font-weight="800">1. Normalize</text><text x="22" y="64" fill="#A6B8B2" font-size="13">youtube.com to HTTPS</text></g>
    <g transform="translate(270 180)"><rect width="150" height="92" rx="14" fill="#0F1720" stroke="#243443"/><text x="22" y="38" fill="#58C7F3" font-size="16" font-weight="800">2. Fetch</text><text x="22" y="64" fill="#A6B8B2" font-size="13">Homepage + pages</text></g>
    <g transform="translate(470 180)"><rect width="150" height="92" rx="14" fill="#0F1720" stroke="#243443"/><text x="22" y="38" fill="#F0B84B" font-size="16" font-weight="800">3. Extract</text><text x="22" y="64" fill="#A6B8B2" font-size="13">Headers, links, forms</text></g>
    <g transform="translate(670 180)"><rect width="150" height="92" rx="14" fill="#0F1720" stroke="#243443"/><text x="22" y="38" fill="#9B8CFF" font-size="16" font-weight="800">4. Evaluate</text><text x="22" y="64" fill="#A6B8B2" font-size="13">Run rule checks</text></g>
    <g transform="translate(870 180)"><rect width="150" height="92" rx="14" fill="#0F1720" stroke="#243443"/><text x="22" y="38" fill="#6FF1D1" font-size="16" font-weight="800">5. Report</text><text x="22" y="64" fill="#A6B8B2" font-size="13">Scores + fixes</text></g>
    <line x1="220" y1="226" x2="266" y2="226" stroke="#58C7F3" stroke-width="2" marker-end="url(#arrow)"/><line x1="420" y1="226" x2="466" y2="226" stroke="#58C7F3" stroke-width="2" marker-end="url(#arrow)"/><line x1="620" y1="226" x2="666" y2="226" stroke="#58C7F3" stroke-width="2" marker-end="url(#arrow)"/><line x1="820" y1="226" x2="866" y2="226" stroke="#58C7F3" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="145" y="350" width="910" height="70" rx="14" fill="#101923" stroke="#243443"/>
    <text x="178" y="392" fill="#E8F0ED" font-size="18" font-weight="800">Output:</text>
    <text x="260" y="392" fill="#A6B8B2" font-size="18">Grade, readiness score, reliability score, top priorities, evidence snippets, fix steps, and standards references.</text>
  </g>
</svg>
